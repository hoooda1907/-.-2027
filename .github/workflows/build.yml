name: Build Aswaq Badr
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # ويندوز 10 / 11 (Electron 30)
  windows-modern:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build-exe
      - shell: bash
        run: mkdir out && cp dist/*.exe "out/AswaqBadr-Windows10-11.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AswaqBadr-Windows-10-11
          path: out/*.exe
  # ويندوز 7 / 8 / 10 / 11 - 32 و 64 بت (Electron 22) - نسخة واحدة تعمل على كل الأجهزة
  windows-legacy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm install --no-save electron@22.3.27
      - run: npm run prep
      - run: npx electron-builder --win nsis --x64 --ia32 --publish never -c.electronVersion=22.3.27
      - shell: bash
        run: mkdir out && cp dist/*.exe "out/AswaqBadr-Windows-All-Versions.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: AswaqBadr-Windows-7-8-10-11-AllInOne
          path: out/*.exe
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npm run prep
      - run: npx cap add android
      - run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AswaqBadr-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
